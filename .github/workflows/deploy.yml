name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The push's own checks, which the deploy needs: never another branch's or commit's results
  lint:
    uses: ./.github/workflows/lint.yml
  build:
    uses: ./.github/workflows/build.yml
  api-tests:
    uses: ./.github/workflows/api-tests.yml
  e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, build, api-tests, e2e]
    timeout-minutes: 20
    concurrency: deploy-${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: arkyvree
            config: fly.web.toml
          - app: arkyvree-worker
            config: fly.worker.toml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A re-run of an older push mustn't deploy over a newer one, which its own run deploys
      - name: Check that main is still at ${{ github.sha }}
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $head, which its own run deploys"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.head.outputs.current == 'true'
        run: flyctl deploy --remote-only --config ${{ matrix.config }} --app ${{ matrix.app }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

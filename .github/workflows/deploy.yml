name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The push's own checks, which the deploy needs: never another branch's or commit's results
  lint:
    uses: ./.github/workflows/lint.yml
  build:
    uses: ./.github/workflows/build.yml
  api-tests:
    uses: ./.github/workflows/api-tests.yml
  e2e:
    uses: ./.github/workflows/e2e.yml

  # Outside the deploy's queue, so an older push (a re-run, a late check) never takes the place of main's newest
  head:
    name: Main's head
    runs-on: ubuntu-latest
    needs: [lint, build, api-tests, e2e]
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Check that main is still at ${{ github.sha }}
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ -z "$head" ]; then
            echo "::error::Couldn't read main's head"
            exit 1
          elif [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $head, which its own run deploys"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: head
    if: needs.head.outputs.current == 'true'
    timeout-minutes: 30
    # One deploy at a time, both apps on one commit
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The web app first: its release command migrates the database the worker's code expects
      - run: flyctl deploy --remote-only --config fly.web.toml --app arkyvree
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --config fly.worker.toml --app arkyvree-worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Deploys only a commit that every check workflow passed on, in its own runs for this push: never a green result
      # from another branch or revision. A failed workflow fails this job; re-run it once the workflow passes.
      - name: Wait for the checks of ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOWS: '["Lint", "Build", "API Tests", "E2E"]'
        run: |
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" | jq -r --argjson names "$WORKFLOWS" '
              [.workflow_runs[] | select(.name as $name | $names | index($name))] as $runs
              | if any($runs[]; .status == "completed" and .conclusion != "success") then "failed"
                elif ([$runs[] | select(.conclusion == "success") | .name] | unique | length) == ($names | length) then "passed"
                else "pending" end')
            echo "$(date +%T) $state"
            case $state in
              passed) exit 0 ;;
              failed) exit 1 ;;
            esac
            sleep 20
          done

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    concurrency: deploy-${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: arkyvree
            config: fly.web.toml
          - app: arkyvree-worker
            config: fly.worker.toml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config ${{ matrix.config }} --app ${{ matrix.app }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: App Image

# The self-hosted image (docker/Dockerfile, docs/self-hosting.md). A pull request that touches it builds it, starts it
# once, then tests it through ONCE (scripts/once/test.sh): installed from the latest release, updated to this image,
# backed up, restored and restarted. A version tag (v1.2.3) runs the same, then publishes it to ghcr.io for amd64 and
# arm64, as that version, and as `latest` (which ONCE pulls again to update an install) when it's the highest release.
# Each week, and on demand, main's image is tested with ONCE's own background runner too, which updates and backs up
# an install by itself.
on:
  pull_request:
    branches: [main]
    paths:
      - .dockerignore
      - docker/**
      - scripts/once/**
      - .github/workflows/app-image.yml
      # What the image's start runs: the server's and the worker's start, the updating page, the probes, the
      # migrations, the files kept on disk, the dependencies the binaries are compiled with, PDFKit's runtime
      - bun.lock
      - drizzle/**
      - scripts/db/migrate.ts
      - server/main.ts
      - server/worker.ts
      - server/noticePages.ts
      - server/routers/health.ts
      - server/routers/files.ts
      - server/storage/**
      - runtime/**
  push:
    tags: ["v*.*.*"]
  schedule:
    # Mondays, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A new push to a pull request cancels its previous run; each release runs to the end
concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: App Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts
        run: |
          shellcheck -x --severity=warning docker/entrypoint.sh docker/lib.sh docker/hooks/* \
            scripts/once/test.sh scripts/once/try.sh scripts/once/local.sh
      - uses: docker/setup-buildx-action@v3
      # The amd64 image, as the release publishes it: built once, then saved for the ONCE test
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: arkyvree-app:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Its first start: the bundled database made and migrated, the server and the worker up. The SMTP server is
      # only named: nothing is sent.
      - name: Start it
        run: |
          docker run -d --name app -p 127.0.0.1:8080:80 \
            -e BASE_URL=http://127.0.0.1:8080 -e DISABLE_SSL=true -e SECRET_KEY_BASE=check-only \
            -e SMTP_ADDRESS=smtp.invalid -e SMTP_PORT=587 arkyvree-app:check
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/up)" = 200 ]; then
              docker logs app
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: Stop it cleanly
        run: |
          docker stop -t 60 app
          docker logs app 2>&1 | grep -q "database system is shut down"
      - name: Save it
        shell: bash
        run: docker save arkyvree-app:check | gzip -1 >"$RUNNER_TEMP/app-image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}/app-image.tar.gz
          retention-days: 1
          compression-level: 0

  once:
    name: ONCE
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-image
          path: ${{ runner.temp }}
      - name: Load the image
        shell: bash
        run: gunzip -c "$RUNNER_TEMP/app-image.tar.gz" | docker load
      # Weekly and on demand, ONCE's background runner too: its first check comes five minutes in
      - name: Test it with ONCE
        env:
          BACKGROUND: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: scripts/once/test.sh --image arkyvree-app:check ${BACKGROUND:+--background}

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: once
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `latest` (what ONCE updates to) moves only to the highest release: never back to an older version's fix, never
      # to a prerelease (v1.2.0-rc.1), which metadata-action's `latest=auto` already leaves out
      - id: latest
        name: Whether this release is the highest
        run: |
          highest=$(git tag -l 'v*.*.*' | grep -v -- - | sort -V | tail -n 1)
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then echo "flavor=latest=auto" >>"$GITHUB_OUTPUT"; else echo "flavor=latest=false" >>"$GITHUB_OUTPUT"; fi
      # The arm64 image installs PostgreSQL under emulation; its binaries are cross-compiled
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/philippechab/arkyvree
          flavor: ${{ steps.latest.outputs.flavor }}
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

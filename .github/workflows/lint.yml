name: Lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  # Deploy runs it for main's pushes
  workflow_call:

# A new push to a pull request cancels its previous run; each push runs to the end
concurrency:
  group: lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check

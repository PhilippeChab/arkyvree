name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

  api-tests-full:
    name: API Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arkyvree_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Seed database
        run: bun test:db:reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/arkyvree_test
          SIGNING_SECRET: ci-signing-secret
          S3_BUCKET: ci-bucket
          S3_ENDPOINT: https://fake.example.com
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_PUBLIC_URL: https://fake.example.com/ci-bucket
      - name: Run API Tests (shard ${{ matrix.shard }}/3)
        run: bun --env-file=.env.test test --shard=${{ matrix.shard }}/3 tests/routers tests/services tests/characters tests/seeds tests/cache
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/arkyvree_test
          SIGNING_SECRET: ci-signing-secret
          S3_BUCKET: ci-bucket
          S3_ENDPOINT: https://fake.example.com
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_PUBLIC_URL: https://fake.example.com/ci-bucket

  api-tests-changed:
    name: API Tests (changed)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arkyvree_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so --changed can diff against the base branch
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Seed database
        run: bun test:db:reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/arkyvree_test
          SIGNING_SECRET: ci-signing-secret
          S3_BUCKET: ci-bucket
          S3_ENDPOINT: https://fake.example.com
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_PUBLIC_URL: https://fake.example.com/ci-bucket
      - name: Run API Tests (changed vs ${{ github.base_ref }})
        run: bun --env-file=.env.test test --changed=origin/${{ github.base_ref }} tests/routers tests/services tests/characters tests/seeds tests/cache
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/arkyvree_test
          SIGNING_SECRET: ci-signing-secret
          S3_BUCKET: ci-bucket
          S3_ENDPOINT: https://fake.example.com
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_PUBLIC_URL: https://fake.example.com/ci-bucket

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    concurrency: deploy-${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: arkyvree
            config: fly.web.toml
          - app: arkyvree-worker
            config: fly.worker.toml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify develop CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          develop_sha=$(git rev-parse origin/develop)
          runs=$(gh run list --branch develop --workflow ci.yml --commit "$develop_sha" --json conclusion,status --limit 5)
          green=$(echo "$runs" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$green" -lt 1 ]; then
            echo "::error::develop ($develop_sha) does not have a successful CI run. Wait for develop CI to go green before merging to main."
            echo "$runs" | jq .
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config ${{ matrix.config }} --app ${{ matrix.app }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: Bug report
description: Report a reproducible problem in Arkyvree.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow [SECURITY.md](https://github.com/PhilippeChab/arkyvree/blob/develop/SECURITY.md) instead.
        Do not include credentials, private campaign data, or personal information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal example without private user data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hosted or self-hosted, commit or version, browser, OS, and device size. Include Bun and database versions for local issues.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Optional. Remove secrets and personal information first.
